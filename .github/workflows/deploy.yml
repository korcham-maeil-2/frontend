# 배포 (CD): main의 CI가 성공하면 라즈베리파이에서 최신 main으로 다시 띄운다.
#
# - 라즈베리파이의 셀프호스티드 러너(라벨 maeil2-pi-frontend)가 실행한다. 포트를 열 필요가 없다.
# - 배포 폴더(서버에 clone해 둔 frontend 저장소)에서 git pull → docker compose up -d --build.
# - 저장소가 public이라, main에 push된 CI 결과(또는 수동 실행)에서만 돈다. PR에서는 실행되지 않는다.
#
# 수동 배포: GitHub 저장소 → Actions → 배포 → Run workflow

name: 배포

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: 라즈베리파이 배포
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: [self-hosted, maeil2-pi-frontend]
    timeout-minutes: 30
    env:
      # 서버에 clone해 둔 배포 폴더. 저장소 Settings → Variables → DEPLOY_DIR
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
      HEALTH_URL: ${{ vars.HEALTH_URL || 'https://maeil2-frontend.sunghoyaaa.com' }}
    steps:
      - name: 최신 main 받기
        run: |
          set -euo pipefail
          test -n "$DEPLOY_DIR" || { echo "DEPLOY_DIR 변수가 비어 있습니다"; exit 1; }
          cd "$DEPLOY_DIR"
          git fetch --prune origin main
          git checkout -q -B main origin/main
          git log --oneline -1

      - name: 다시 빌드하고 띄우기
        run: |
          set -euo pipefail
          cd "$DEPLOY_DIR"
          docker compose up -d --build --remove-orphans

      - name: 동작 확인
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null "$HEALTH_URL"; then echo "배포 성공"; exit 0; fi
            sleep 3
          done
          echo "동작 확인 실패"
          cd "$DEPLOY_DIR" && docker compose logs --tail 50 frontend
          exit 1

      - name: 안 쓰는 이미지 정리
        if: always()
        run: docker image prune -f
